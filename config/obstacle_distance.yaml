# robot_vision 통합 설정. 변경 후 해당 노드를 다시 실행하세요.
# 생략한 세부 검출/추적 항목은 기존 코드 기본값을 사용합니다.
obstacle_distance:
  ros__parameters:

    # 영상과 화면
    image_topic: /camera1/camera/compressed_image
    viewer: true
    viewer_fullscreen: true
    show_preprocess: false
    max_processing_fps: 30.0

    # 기존 캘리브레이션 (640×480, 임의 변경 금지)
    calibration_width: 640
    calibration_height: 480
    camera_matrix: [471.953641, 0.0, 309.509126, 0.0, 476.574144, 228.222101, 0.0, 0.0, 1.0]
    distortion_coefficients: [0.026101, -0.086354, -0.007248, -0.006668, 0.0]
    calibration_verified: false

    # 기존 장애물 크기와 카메라 높이 (m)
    obstacle_size_m: 0.4
    camera_height_m: 0.61

    # 현장에서 조정하는 색상 HSV 및 최소 면적 (px²)
    red_lower_1: [0, 60, 60]
    red_upper_1: [12, 255, 255]
    red_lower_2: [168, 60, 60]
    red_upper_2: [179, 255, 255]
    blue_lower: [105, 170, 45]
    blue_upper: [125, 255, 255]
    min_area_px: 500.0

    # 흰색 경계선 주변의 잔디색 판단 기준 (기존 코드 기본값)
    lane_grass_hue_min: 43            # 색상 H 최소값 (0~179)
    lane_grass_hue_max: 95             # 색상 H 최대값 (0~179)
    lane_grass_min_saturation: 60    # 채도 S 최소값 (0~255)
    lane_min_grass_support: 0.80       # 선 안쪽의 잔디색 최소 비율 (0~1)

camera_bev_preview:
  ros__parameters:
    # 왜곡 보정 화면의 픽셀. 순서: 먼 왼쪽 → 먼 오른쪽 → 가까운 오른쪽 → 가까운 왼쪽.
    # [x1, y1, x2, y2, x3, y3, x4, y4]. []는 미선택. 클릭 후 S로 저장.
    source_points: []
    # 출력 [가로, 세로] 픽셀 크기.
    bev_size: [640, 480]
    # 선택한 바닥 직사각형의 실측 가로/세로(m). 0.0은 아직 미입력.
    # 이번 단계는 기록만 하며 미터 환산·각도 계산에 아직 사용하지 않습니다.
    field_width_m: 0.0
    field_height_m: 0.0
